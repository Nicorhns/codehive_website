    .app-store-badge {

    /* Feature grid */

    /* Intermittent Living highlight */

      border-radius: 16px;
      padding: 3rem;

  <!-- Prevent flash of wrong theme -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      var root = document.documentElement;
      var metas = document.querySelectorAll('meta[name="theme-color"]');

      function setThemeColor(color) {
        metas.forEach(function(m) {
          m.removeAttribute('media');
          m.setAttribute('content', color);
        });
      }

      function restoreMediaThemeColor() {
        metas[0].setAttribute('media', '(prefers-color-scheme: light)');
        metas[0].setAttribute('content', '#fafafa');
        metas[1].setAttribute('media', '(prefers-color-scheme: dark)');
        metas[1].setAttribute('content', '#0a0a0a');
      }

      if (saved && saved !== 'auto') {
        root.setAttribute('data-theme', saved);
        setThemeColor(saved === 'light' ? '#fafafa' : '#0a0a0a');
      } else {
        root.removeAttribute('data-theme');
        restoreMediaThemeColor();
      }
    })();
  </script>

  <script>
    // --- Theme: auto mode only (follows system preference) ---
    (function() {
      var root = document.documentElement;
      var metas = document.querySelectorAll('meta[name="theme-color"]');

      function restoreMediaThemeColor() {
        metas[0].setAttribute('media', '(prefers-color-scheme: light)');
        metas[0].setAttribute('content', '#fafafa');
        metas[1].setAttribute('media', '(prefers-color-scheme: dark)');
        metas[1].setAttribute('content', '#0a0a0a');
      }

      localStorage.removeItem('theme');
      root.removeAttribute('data-theme');
      restoreMediaThemeColor();

      var systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)');
      systemPrefersLight.addListener(function() {
        root.removeAttribute('data-theme');
        restoreMediaThemeColor();
      });
    })();

    // --- Scroll fade-in ---
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.fade-in').forEach(function(el) {
      observer.observe(el);
    });

  </script>
